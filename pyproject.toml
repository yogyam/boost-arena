[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boost-arena"
dynamic = ["version"]
description = "An open, task-based benchmark for car-football bots, scored in the RocketSim simulator"
readme = "README.md"
license = { text = "MIT" }
# Not 3.13 yet: rlgym-rocket-league pins numpy below 2, which leaves onnx without a working ml_dtypes there
requires-python = ">=3.11,<3.14"
authors = [{ name = "Yogya Mehrotra", email = "ymehrotra@ucsd.edu" }]
keywords = ["benchmark", "reinforcement-learning", "rocketsim", "rlgym", "leaderboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography",
    "numpy",
    "onnx",
    "onnxruntime",
    "rocketsim==2.2.1",
    # Brings the arena collision files that the simulator needs
    "rlgym-rocket-league[sim]==2.0.1",
]

[project.urls]
Leaderboard = "https://yogyam.github.io/boost-arena/"
Repository = "https://github.com/yogyam/boost-arena"
Issues = "https://github.com/yogyam/boost-arena/issues"
Changelog = "https://github.com/yogyam/boost-arena/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Only needed to convert checkpoints from other training frameworks
convert = ["torch"]
# The starter kit: training on the open RLGym tools
train = ["torch", "rlgym-learn", "rlgym-learn-algos"]
dev = ["pytest", "ruff", "matplotlib"]   # matplotlib only for tools/make_figures.py

[project.scripts]
boost-arena = "boost_arena.cli:main"

[tool.setuptools.dynamic]
version = { attr = "boost_arena.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boost_arena = ["*.html", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests", "tools", "dev"]
exclude = ["src/boost_arena/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # Line length is the formatter's business
    "SIM115",  # Plain open() calls read fine in this codebase
    "SIM108",  # An if/else is often clearer than a conditional expression
    "SIM102",  # Nested ifs are allowed where they read better
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/test_starter.py" = ["E402"]   # importorskip must come before the imports
"tools/*" = ["E402"]

name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "submissions/**"
      - "results/**"
      - "replays/**"
      - "duels/**"
      - "flags.json"
  pull_request:
    paths-ignore:
      - "submissions/**"
      - "results/**"
      - "replays/**"
      - "duels/**"
      - "flags.json"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: ruff check src tests tools dev
      - run: ruff format --check src tests tools dev

  # The README promises Linux, macOS and Windows on Python 3.11 and 3.12, so all are tested.
  # 3.13 waits for rlgym-rocket-league to allow numpy 2.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet ".[dev]"
      - run: pytest -q

  # The starter kit needs PyTorch, which the other jobs do without. The CPU build keeps it small.
  starter-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --quiet ".[dev,train]"
      - run: pytest -q tests/test_starter.py

name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "submissions/**"
      - "results/**"
  pull_request:
    paths-ignore:
      - "submissions/**"
      - "results/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ".[dev]"
      - run: pytest -q

name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "submissions/**"
      - "results/**"
      - "replays/**"
      - "duels/**"
  pull_request:
    paths-ignore:
      - "submissions/**"
      - "results/**"
      - "replays/**"
      - "duels/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ".[dev]"
      - run: pytest -q

# Runs on every pull request that touches submissions/. It has no secrets and cannot open a
# sealed model; it checks that the manifest is well formed and that the sealed file is where
# the manifest says it is, with the right checksum.
name: Check submission

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet .

      - name: Find the submissions this pull request changes
        id: changed
        run: |
          folders=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- submissions/ \
            | awk -F/ 'NF >= 3 { print $1 "/" $2 }' | sort -u | tr '\n' ' ')
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          echo "Changed: $folders"

      - name: Refuse changes outside submissions/
        run: |
          other=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -v '^submissions/' || true)
          if [ -n "$other" ]; then
            echo "A submission pull request may only change files under submissions/. Also changed:"
            echo "$other"
            exit 1
          fi

      - name: Verify
        if: steps.changed.outputs.folders != ''
        run: boost-arena verify-submission ${{ steps.changed.outputs.folders }}

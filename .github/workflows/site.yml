# Rebuilds the website when results or the site code change on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "replays/**"
      - "duels/**"
      - "src/boost_arena/site.py"
      - "src/boost_arena/replay.html"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet .

      - name: Build
        run: boost-arena build-site --results results --replays replays --duels duels --output site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
